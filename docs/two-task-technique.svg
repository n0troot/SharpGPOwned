<svg viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- ═══ CONNECTORS (drawn first) ═══ -->

  <!-- GPO → T1 -->
  <line x1="432" y1="76" x2="432" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- T1 → DROP -->
  <line x1="432" y1="188" x2="432" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- DROP → REG -->
  <line x1="432" y1="256" x2="432" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- REG → T2 (through gap between containers, coral) -->
  <line x1="432" y1="324" x2="432" y2="408" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

  <!-- T2 → PAY (coral) -->
  <line x1="432" y1="456" x2="432" y2="476" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

  <!-- T1 → D1 (dashed self-delete) -->
  <line x1="312" y1="164" x2="184" y2="164" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- T2 → D2 (dashed self-delete) -->
  <line x1="312" y1="432" x2="184" y2="432" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- ═══ ARROW LABELS ═══ -->

  <!-- "5S DELAY" on REG→T2 vertical (to the right) -->
  <rect x="444" y="356" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="472" y="364" fill="#eb6c36" font-size="8" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">5S DELAY</text>

  <!-- "PT1M EXPIRY" on T1→D1 -->
  <rect x="208" y="144" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="244" y="152" fill="#7a8399" font-size="8" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">PT1M EXPIRY</text>

  <!-- "T + 1 MIN" on T2→D2 -->
  <rect x="216" y="412" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="244" y="420" fill="#7a8399" font-size="8" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">T + 1 MIN</text>

  <!-- ═══ STAGE CONTAINERS ═══ -->

  <!-- Stage 1 container -->
  <rect x="272" y="108" width="320" height="232" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
  <text x="432" y="128" fill="#7a8399" font-size="7" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">STAGE 1 · NT AUTHORITY\SYSTEM</text>

  <!-- Stage 2 container -->
  <rect x="272" y="376" width="320" height="148" rx="8" fill="rgba(235,108,54,0.03)" stroke="rgba(235,108,54,0.15)" stroke-width="1"/>
  <text x="432" y="396" fill="#7a8399" font-size="7" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">STAGE 2 · HIGHESTAVAILABLE — DA SESSION</text>

  <!-- ═══ NODES ═══ -->

  <!-- GPO (start oval) -->
  <rect x="292" y="28" width="280" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="432" y="48" fill="#2d3142" font-size="12" font-weight="600" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">Writable GPO</text>
  <text x="432" y="64" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">linked to workstations w/ DA sessions</text>

  <!-- T1: ImmediateTask -->
  <rect x="312" y="140" width="240" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="312" y="140" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="432" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">ImmediateTask</text>
  <text x="432" y="176" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">XboxLiveUpdate</text>

  <!-- DROP: Drop files -->
  <rect x="312" y="208" width="240" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="312" y="208" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="432" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">Drop files to disk</text>
  <text x="432" y="244" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">add.bat + wsadd.xml</text>

  <!-- REG: Register-ScheduledTask -->
  <rect x="312" y="276" width="240" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="312" y="276" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="432" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">Register-ScheduledTask</text>
  <text x="432" y="312" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">-Xml wsadd.xml</text>

  <!-- T2: Watchdog fires -->
  <rect x="312" y="408" width="240" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="312" y="408" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="432" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">Watchdog fires</text>
  <text x="432" y="444" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">XboxLiveUpdateWatchdog</text>

  <!-- PAY: Payload executes (FOCAL) -->
  <rect x="312" y="476" width="240" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="312" y="476" width="240" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="432" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">Payload executes</text>
  <text x="432" y="512" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Domain Admin context</text>

  <!-- D1: removed (dashed oval) -->
  <rect x="88" y="148" width="96" height="32" rx="16" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="136" y="168" fill="#7a8399" font-size="9" font-family="Consolas, monospace" text-anchor="middle">removed</text>

  <!-- D2: removed (dashed oval) -->
  <rect x="88" y="416" width="96" height="32" rx="16" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="136" y="436" fill="#7a8399" font-size="9" font-family="Consolas, monospace" text-anchor="middle">removed</text>

  <!-- ═══ LEGEND ═══ -->
  <line x1="40" y1="548" x2="640" y2="548" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="568" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" letter-spacing="0.18em">LEGEND</text>

  <rect x="40" y="580" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="72" y="588" fill="#4f5d75" font-size="8" font-family="Segoe UI, system-ui, sans-serif">Step</text>

  <rect x="136" y="580" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="168" y="588" fill="#4f5d75" font-size="8" font-family="Segoe UI, system-ui, sans-serif">Focal step</text>

  <rect x="256" y="580" width="24" height="12" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="288" y="588" fill="#4f5d75" font-size="8" font-family="Segoe UI, system-ui, sans-serif">Self-delete</text>

  <line x1="376" y1="588" x2="404" y2="588" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="412" y="588" fill="#4f5d75" font-size="8" font-family="Segoe UI, system-ui, sans-serif">Happy path</text>

  <line x1="504" y1="588" x2="532" y2="588" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="540" y="588" fill="#4f5d75" font-size="8" font-family="Segoe UI, system-ui, sans-serif">Expiry</text>
</svg>
