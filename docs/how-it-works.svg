<svg viewBox="0 0 840 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- ═══ LIFELINES (dashed verticals, drawn first) ═══ -->
  <line x1="140" y1="80" x2="140" y2="440" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="420" y1="80" x2="420" y2="440" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="700" y1="80" x2="700" y2="440" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ═══ ACTIVATION BARS ═══ -->
  <!-- Attacker: active during writes (msg 1-2) -->
  <rect x="136" y="116" width="8" height="64" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <!-- SYSVOL/DC: active during delivery (msg 4-5) -->
  <rect x="416" y="260" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <!-- Target: active from request through objective (msg 4-7) -->
  <rect x="696" y="260" width="8" height="148" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

  <!-- ═══ MESSAGE ARROWS ═══ -->

  <!-- 1. Attacker → SYSVOL: Write ScheduledTasks.xml -->
  <line x1="144" y1="128" x2="416" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2. Attacker → SYSVOL: Bump version + GPT.INI -->
  <line x1="144" y1="168" x2="416" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4. Target → SYSVOL: Request policy update -->
  <line x1="696" y1="272" x2="424" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 5. SYSVOL → Target: Deliver modified GPO (return — dashed) -->
  <line x1="424" y1="308" x2="696" y2="308" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- 6. Target → Target: Execute ImmediateTask (self-message) -->
  <path d="M 704,348 L 756,348 L 756,372 L 704,372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 7. Target → Attacker: Objective achieved (coral headline) -->
  <line x1="696" y1="400" x2="144" y2="400" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

  <!-- ═══ MESSAGE LABELS ═══ -->

  <!-- Label 1: Write ScheduledTasks.xml -->
  <rect x="212" y="108" width="136" height="12" rx="2" fill="#f5f5f5"/>
  <text x="280" y="116" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">Write ScheduledTasks.xml</text>

  <!-- Label 2: Bump versionNumber + GPT.INI -->
  <rect x="196" y="148" width="168" height="12" rx="2" fill="#f5f5f5"/>
  <text x="280" y="156" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">Bump versionNumber + GPT.INI</text>

  <!-- Label 4: Request policy update -->
  <rect x="496" y="252" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="556" y="260" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">Request policy update</text>

  <!-- Label 5: Deliver modified GPO -->
  <rect x="496" y="288" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="556" y="296" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">Deliver modified GPO</text>

  <!-- Label 6: Run as SYSTEM (self-message, right of loop) -->
  <text x="764" y="364" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" letter-spacing="0.04em">Run as SYSTEM</text>

  <!-- Label 7: Objective achieved (coral) -->
  <rect x="368" y="380" width="108" height="12" rx="2" fill="#f5f5f5"/>
  <text x="420" y="388" fill="#eb6c36" font-size="8" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">Objective achieved</text>

  <!-- ═══ NOTE (between messages 2 and 4) ═══ -->
  <rect x="180" y="204" width="480" height="28" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
  <text x="420" y="220" fill="#7a8399" font-size="8" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.04em" font-style="italic">~90 min GPO refresh cycle — or gpupdate /force on the target</text>

  <!-- ═══ ACTOR BOXES ═══ -->

  <!-- Attacker -->
  <rect x="68" y="40" width="144" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="68" y="40" width="144" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="140" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">Attacker</text>

  <!-- SYSVOL / DC -->
  <rect x="348" y="40" width="144" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="348" y="40" width="144" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="420" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">SYSVOL / DC</text>

  <!-- Target Machine -->
  <rect x="628" y="40" width="144" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="628" y="40" width="144" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="700" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">Target Machine</text>

  <!-- ═══ LEGEND ═══ -->
  <line x1="40" y1="456" x2="800" y2="456" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="476" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" letter-spacing="0.18em">LEGEND</text>

  <line x1="40" y1="492" x2="68" y2="492" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="76" y="492" fill="#4f5d75" font-size="8" font-family="Segoe UI, system-ui, sans-serif">Sync call</text>

  <line x1="180" y1="492" x2="208" y2="492" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="216" y="492" fill="#4f5d75" font-size="8" font-family="Segoe UI, system-ui, sans-serif">Return</text>

  <line x1="300" y1="492" x2="328" y2="492" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="336" y="492" fill="#4f5d75" font-size="8" font-family="Segoe UI, system-ui, sans-serif">Headline success</text>

  <rect x="476" y="486" width="8" height="12" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="492" y="492" fill="#4f5d75" font-size="8" font-family="Segoe UI, system-ui, sans-serif">Activation</text>

  <line x1="580" y1="492" x2="580" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="588" y="492" fill="#4f5d75" font-size="8" font-family="Segoe UI, system-ui, sans-serif">Lifeline</text>
</svg>
